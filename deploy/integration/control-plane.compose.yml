services:
  nats:
    image: nats:latest
    command: ["-js", "-m", "8222"]
    restart: unless-stopped
    ports:
      - "4222:4222"
      #- "8222:8222" # monitoring only

  api:
    image: "${API_IMAGE}"
    pull_policy: always
    restart: unless-stopped
    environment:
      NATS_URL: "nats://nats:4222"
      NATS_SUBJECT: "${NATS_SUBJECT}"
      LISTEN_ADDR: ":8080"
      LOG_LEVEL: "${LOG_LEVEL}"
    ports:
      - "80:8080"
    depends_on:
      nats:
        condition: service_started

  orchestrator:
    image: "${ORCHESTRATOR_IMAGE}"
    pull_policy: always
    restart: unless-stopped
    environment:
      NATS_URL: "nats://nats:4222"
      NATS_NAME: "orchestrator"
      NATS_STREAM: "GPU_JOBS"
      NATS_SUBJECT: "${NATS_SUBJECT}"
      NATS_CONSUMER: "gpu-workers"
      ACK_WAIT: "${ACK_WAIT}"
      MAX_DELIVER: "${MAX_DELIVER}"
      LINODE_TOKEN: "${LINODE_TOKEN}"
      LINODE_TYPE: "${LINODE_TYPE}"
      LINODE_ROOT_PASS: "${LINODE_ROOT_PASS}"
      LINODE_MANAGED_TAG: "${LINODE_MANAGED_TAG}"
      LINODE_CLUSTER_TAG: "${LINODE_CLUSTER_TAG}"
      GOLDEN_IMAGE_ID: "${GOLDEN_IMAGE_ID}"
      MIN_NODES: "${MIN_NODES}"
      MAX_NODES: "${MAX_NODES}"
      MONITOR_INTERVAL: "${MONITOR_INTERVAL}"
      COOLDOWN_DURATION: "${COOLDOWN_DURATION}"
      SCALE_UP_DURATION: "${SCALE_UP_DURATION}"
      SCALE_UP_THRESHOLD: "${SCALE_UP_THRESHOLD}"
      SCALE_DOWN_IDLE_DURATION: "${SCALE_DOWN_IDLE_DURATION}"
      SCALE_TO_ZERO_IDLE_DURATION: "${SCALE_TO_ZERO_IDLE_DURATION}"
      PROMETHEUS_TARGETS_FILE: "/etc/prometheus/file_sd/gpu_targets.json"
      LISTEN_ADDR: ":8081"
      LOG_LEVEL: "${LOG_LEVEL}"
      #ports:
        #- "8081:8081" # metrics and health check only
    volumes:
      - ../shared/prometheus/file_sd:/etc/prometheus/file_sd
    depends_on:
      nats:
        condition: service_started

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    restart: unless-stopped
    command:
      - -varz
      - -connz
      - -routez
      - -subz
      - -jsz=all
      - http://nats:8222
    depends_on:
      nats:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ../shared/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../shared/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ../shared/prometheus/file_sd:/etc/prometheus/file_sd
      - prometheus_data:/prometheus
    depends_on:
      orchestrator:
        condition: service_started
      nats-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../shared/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../shared/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../shared/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    external: true
    name: serverless-net
