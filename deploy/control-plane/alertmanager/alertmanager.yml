route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: "default-log"
  routes:
    - receiver: "orchestrator-webhook"
      matchers:
        - alertname=~"GPUIdle.*"

receivers:
  - name: "default-log"

  - name: "orchestrator-webhook"
    webhook_configs:
      - url: "http://orchestrator:8081/alerts"
        send_resolved: true
